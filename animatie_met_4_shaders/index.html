

<html>
  <head>
    <title>shaders met 4 fragmentShaders in three.js</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8" />
    <style> body { margin: 0;} </style>
  </head>
<body>

 <script type="importmap">
     {
       "imports": {
       "three": "../build/three.module.js",
       "three/addons/": "../jsm/" }
    }
 </script>

<script id="vertexShader" type="x-shader/x-vertex">
   varying vec3 vUv; //is de positie van de x,y,z coordinaten
   void main() {
   vUv = position;
   vec4 modelViewPosition = modelViewMatrix * vec4(position, 1.);
   gl_Position = projectionMatrix * modelViewPosition;
 }
</script>

<script id="fragmentShaderSphere" type="x-shader/x-fragment">
   varying vec3 vUv;
   uniform float u_time;
   void main(){
   float d = length(abs(vUv)-0.180) + length(abs(vUv)-0.840);
   float pct = fract(d*sin(u_time/10.)*12.);
   gl_FragColor = pct+vec4(vec3(0.20,0.06,0.518),0.5);
 }
</script>

<script id="fragmentShaderBoxLi" type="x-shader/x-fragment">
  varying vec3 vUv;
  uniform float u_time;
  void main(){
 float d = length(abs(vUv)-0.180) * length(abs(vUv)-0.840);
  float pct = fract(d*sin(u_time/10.)*12.);
  gl_FragColor = pct+vec4(vec3(0.500,0.006,0.218),0.5);
 }
</script>

<script id="fragmentShaderBoxMi" type="x-shader/x-fragment">
 varying vec3 vUv;
 uniform float u_time;
 void main(){
 float d = length(abs(vUv)-0.564) - length(abs(vUv)-0.832);
 float pct = fract(d*sin(u_time/10.)*12.);
 gl_FragColor = pct+vec4(vec3(0.500,0.006,0.218),0.5);
}
</script>

<script id="fragmentShaderBoxRe" type="x-shader/x-fragment">
 varying vec3 vUv;
 uniform float u_time;
 void main(){
 float d = length(abs(vUv)-0.252) / length(abs(vUv)-0.344);
 float pct = fract(d*sin(u_time/10.)*12.);
 gl_FragColor = pct+vec4(vec3(0.500,0.006,0.218),0.5);
}
</script>


<script type="module">
 import * as THREE from 'three';
 import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
 import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
//u_time global declareren omda deze wordt gebuikt in de animatie functie
 const uniforms = {u_time: {type: 'float',value: 1.0}}

let scene, camera, grid, renderer , boxLiM , sphereM , boxReM , boxMiM;
//de begin waaarde van de booleans
let ruitjes  = true; let sphere = false; let boxen = false;
let wolken = true; let rotatie = true;
///data tbv de GUI
const data = {
 rotatie: true,   wolken: true,
 sphere: true, boxen: true, ruitjes: false };

 init();
 play();
 function init() {
   window.addEventListener( 'resize', onWindowResize );
   scene = new THREE.Scene();
   createBackground();
   createGrid();
   createCamera();
   createBoxLi(); //linker box
   createSphere();
   createBoxMi(); //midden box
   createBoxRe(); //rechter box
   createGui(); //voor het controlvenster rechts boven
   createRenderer();
   createControls();  //voor de muiscontrols
   onWindowResize();
 }

 function createBackground() {
   if (wolken==false)
      {const bgColor = new THREE.Color( 0xE6FBFF );
      scene.background = bgColor;
      wolken = true;}
   else
     {const loader = new THREE.TextureLoader();
      const bgTexture = loader.load('../textures/cloud.jpg');
      scene.background = bgTexture;
      wolken = false;}
 }

 function createGrid() {
   const size = 10;
   const divisions = 10;
   grid = new THREE.GridHelper( size, divisions );
   grid.rotation.x = Math.PI / 2;// het ruitjespapier 90 graden draaien
   scene.remove( grid );
 }

 function createCamera(){
   camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 1, 1000 );
    camera.position.set( 0, 0, 2.5 );
 }

 function createBoxLi() {
   let boxMat = new THREE.ShaderMaterial ({
   uniforms: uniforms,side: THREE.DoubleSide,
   vertexShader: document.getElementById('vertexShader').textContent,
   fragmentShader: document.getElementById('fragmentShaderBoxLi').textContent,
    //door onderstaande code toe te voegen werkt alpha in gl_FragColor
   //de material zal mengen met de achtergrond en kan transparant worden
   blending: THREE.NormalBlending, transparent: true});

   let boxG = new THREE.BoxGeometry();
   boxLiM = new THREE.Mesh(boxG, boxMat);
   boxLiM.position.set(-2,0,0);
   scene.add(boxLiM);
 }

 function createSphere() {
   let sphereMat = new THREE.ShaderMaterial ({
   uniforms: uniforms, side: THREE.DoubleSide,
   vertexShader: document.getElementById('vertexShader').textContent,
   fragmentShader: document.getElementById('fragmentShaderSphere').textContent,
   blending: THREE.NormalBlending, transparent: true});

   let sphereG = new THREE.SphereGeometry();
   sphereM = new THREE.Mesh(sphereG, sphereMat);
   sphereM.position.set(0,0,0);
   scene.add(sphereM);
 }

 function createBoxMi() {
   let boxMat = new THREE.ShaderMaterial ({
   uniforms: uniforms,side: THREE.DoubleSide,
   vertexShader: document.getElementById('vertexShader').textContent,
   fragmentShader: document.getElementById('fragmentShaderBoxMi').textContent,
   blending: THREE.NormalBlending, transparent: true});

   let boxG = new THREE.BoxGeometry();
   boxMiM = new THREE.Mesh(boxG, boxMat);
   boxMiM.position.set(0,0,0);
   scene.add(boxMiM);
 }

 function createBoxRe() {
   let boxMat = new THREE.ShaderMaterial ({
   uniforms: uniforms,side: THREE.DoubleSide,
   vertexShader: document.getElementById('vertexShader').textContent,
   fragmentShader: document.getElementById('fragmentShaderBoxRe').textContent,
   blending: THREE.NormalBlending, transparent: true});

   let boxG = new THREE.BoxGeometry();
   boxReM = new THREE.Mesh(boxG, boxMat);
   boxReM.position.set(2,0,0);
   scene.add(boxReM);
 }

 function createGui() {
   let gui = new GUI({width: 100});
   gui.add(data, 'rotatie');
   gui.add(data, 'wolken') .onChange(createBackground);
   gui.add(data, 'sphere') .onChange(sphereOnOf);
   gui.add(data, 'boxen')  .onChange(boxenOnOf);
   gui.add(data, 'ruitjes').onChange(gridOnOf);
   gui.open();
}

function sphereOnOf() {
  if (sphere) {scene.add(sphereM), sphere = false;}
  else {scene.remove(sphereM), sphere = true;}
}

function boxenOnOf() {
 if (boxen) {scene.add(boxLiM), scene.add(boxReM), boxen = false;}
 else {scene.remove(boxLiM), scene.remove(boxReM), boxen = true;}
}

 function gridOnOf(){
    if (ruitjes) {scene.add(grid), ruitjes = false;}
    else {scene.remove(grid), ruitjes = true;}
}

 function createRenderer(){
   renderer = new THREE.WebGLRenderer();
   renderer.setPixelRatio( window.devicePixelRatio );
   renderer.setSize( window.innerWidth, window.innerHeight);
   document.body.appendChild( renderer.domElement );
   renderer.outputColorSpace = THREE.SRGBColorSpace;
 }

 function createControls() {
     const controls = new OrbitControls( camera , renderer.domElement);
     controls.listenToKeyEvents( window );
      //als default wordt er naar de pijltjestoetsen geluister
 }

 function onWindowResize() {
   camera.aspect = window.innerWidth/ window.innerHeight;
   camera.updateProjectionMatrix();
   renderer.setSize(window.innerWidth, window.innerHeight);
 }

 function render() {
   renderer.render( scene, camera );
 }

 function animate() {
   uniforms.u_time.value += 0.02;
   if (data.rotatie){
   sphereM.rotation.y += 0.01; sphereM.rotation.x += 0.01;
   boxLiM.rotation.y  -= 0.01;  boxLiM.rotation.x -= 0.01;
   boxReM.rotation.x  -= 0.01;  boxReM.rotation.y -= 0.01;}
 }

 function play() {
   renderer.setAnimationLoop( () => {animate();render();} );
}
   </script>
 </body>
</html>
