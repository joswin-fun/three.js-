<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shaders met 4 fragment shaders in three.js</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
    </style>
  </head>
  <body>
    <script type="importmap">
      {
        "imports": {
          "three": "../build/three.module.js",
          "three/addons/": "../jsm/"
        }
      }
    </script>

    <script id="vertexShader" type="x-shader/x-vertex">
      varying vec3 vUv;

      void main() {
        vUv = position;
        vec4 modelViewPosition = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * modelViewPosition;
      }
    </script>

    <script id="fragmentShaderSphere" type="x-shader/x-fragment">
      precision highp float;
      varying vec3 vUv;
      uniform float u_time;

      void main() {
        float d = length(abs(vUv) - 0.180) + length(abs(vUv) - 0.840);
        float pct = fract(d * sin(u_time * 0.1) * 12.0);
        vec3 tint = vec3(0.20, 0.06, 0.518);
        gl_FragColor = vec4(pct + tint, 0.7);
      }
    </script>

    <script id="fragmentShaderBoxLi" type="x-shader/x-fragment">
      precision highp float;
      varying vec3 vUv;
      uniform float u_time;

      void main() {
        float d = length(abs(vUv) - 0.180) * length(abs(vUv) - 0.840);
        float pct = fract(d * sin(u_time * 0.1) * 12.0);
        vec3 tint = vec3(0.500, 0.006, 0.218);
        gl_FragColor = vec4(pct + tint, 0.5);
      }
    </script>

    <script id="fragmentShaderBoxMi" type="x-shader/x-fragment">
      precision highp float;
      varying vec3 vUv;
      uniform float u_time;

      void main() {
        float d = length(abs(vUv) - 0.564) - length(abs(vUv) - 0.832);
        float pct = fract(d * sin(u_time * 0.1) * 12.0);
        vec3 tint = vec3(0.500, 0.006, 0.218);
        gl_FragColor = vec4(pct + tint, 0.5);
      }
    </script>

    <script id="fragmentShaderBoxRe" type="x-shader/x-fragment">
      precision highp float;
      varying vec3 vUv;
      uniform float u_time;

      void main() {
        float d = length(abs(vUv) - 0.252) / length(abs(vUv) - 0.344);
        float pct = fract(d * sin(u_time * 0.1) * 12.0);
        vec3 tint = vec3(0.500, 0.006, 0.218);
        gl_FragColor = vec4(pct + tint, 0.5);
      }
    </script>

    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

      const uniforms = {
        u_time: { value: 0.0 }
      };

      const meshes = {};

      const state = {
        rotatie: true,
        wolken: true,
        sphere: true,
        boxen: true,
        ruitjes: false
      };

      let scene;
      let camera;
      let renderer;
      let grid;
      let controls;

      init();

      function init() {
        scene = new THREE.Scene();

        createCamera();
        createBackground();
        createGrid();
        createGeometry();
        createRenderer();
        createControls();
        createGui();

        window.addEventListener('resize', onWindowResize);
        onWindowResize();

        renderer.setAnimationLoop(animate);
      }

      function createCamera() {
        camera = new THREE.PerspectiveCamera(
          70,
          window.innerWidth / window.innerHeight,
          1,
          1000
        );
        camera.position.set(0, 0, 3.0);
        camera.lookAt(0, 0, 0);
      }

      function createBackground() {
        if (state.wolken) {
          const loader = new THREE.TextureLoader();
          loader.load(
            '../textures/cloud.jpg',
            (texture) => {
              scene.background = texture;
            },
            undefined,
            () => {
              scene.background = new THREE.Color(0xe6fbff);
            }
          );
        } else {
          scene.background = new THREE.Color(0xe6fbff);
        }
      }

      function createGrid() {
        grid = new THREE.GridHelper(10, 10);
        grid.rotation.x = Math.PI / 2;
        grid.visible = state.ruitjes;
        scene.add(grid);
      }

      function createGeometry() {
        const vertexShader = document.getElementById('vertexShader').textContent;

        const config = [
          {
            key: 'leftBox',
            shaderId: 'fragmentShaderBoxLi',
            geometry: new THREE.BoxGeometry(1.1, 1.1, 1.1),
            position: [-2, 0, 0]
          },
          {
            key: 'sphere',
            shaderId: 'fragmentShaderSphere',
            geometry: new THREE.SphereGeometry(0.75, 48, 48),
            position: [0, 0, 0]
          },
          {
            key: 'middleBox',
            shaderId: 'fragmentShaderBoxMi',
            geometry: new THREE.BoxGeometry(1.1, 1.1, 1.1),
            position: [0, 0, 0]
          },
          {
            key: 'rightBox',
            shaderId: 'fragmentShaderBoxRe',
            geometry: new THREE.BoxGeometry(1.1, 1.1, 1.1),
            position: [2, 0, 0]
          }
        ];

        config.forEach(({ key, shaderId, geometry, position }) => {
          meshes[key] = createShaderMesh(
            vertexShader,
            document.getElementById(shaderId).textContent,
            geometry,
            position
          );
        });
      }

      function createShaderMesh(vertexShader, fragmentShader, geometry, position) {
        const material = new THREE.ShaderMaterial({
          uniforms,
          vertexShader,
          fragmentShader,
          side: THREE.DoubleSide,
          transparent: true,
          blending: THREE.NormalBlending
        });

        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(position[0], position[1], position[2]);
        scene.add(mesh);

        return mesh;
      }

      function createRenderer() {
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);
      }

      function createControls() {
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enablePan = false;
        controls.minDistance = 1.5;
        controls.maxDistance = 8;
        controls.target.set(0, 0, 0);
      }

      function createGui() {
        const gui = new GUI({ width: 200 });

        gui.add(state, 'rotatie');
        gui.add(state, 'wolken').onChange(() => {
          createBackground();
        });

        gui.add(state, 'sphere').onChange((value) => {
          meshes.sphere.visible = value;
        });

        gui.add(state, 'boxen').onChange((value) => {
          meshes.leftBox.visible = value;
          meshes.middleBox.visible = value;
          meshes.rightBox.visible = value;
        });

        gui.add(state, 'ruitjes').onChange((value) => {
          grid.visible = value;
        });

        gui.open();
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        uniforms.u_time.value += 0.02;

        if (state.rotatie) {
          meshes.sphere.rotation.y += 0.01;
          meshes.sphere.rotation.x += 0.01;

          meshes.leftBox.rotation.y -= 0.01;
          meshes.leftBox.rotation.x -= 0.01;

          meshes.middleBox.rotation.y += 0.008;
          meshes.middleBox.rotation.x += 0.006;

          meshes.rightBox.rotation.x -= 0.01;
          meshes.rightBox.rotation.y -= 0.01;
        }

        controls.update();
        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
